# Push a tag like v1.0.0 to build the MSI and portable zip and attach them to a draft release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The MSI takes its version from wails.json, so the tag has to agree with it.
      - name: Check the tag matches wails.json
        run: |
          $v = (Get-Content wails.json | ConvertFrom-Json).info.productVersion
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match productVersion $v in wails.json" }

      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Install WiX 3
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip "$env:LOCALAPPDATA\wix314"
      - run: ./build.ps1

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME build/bin/Lightmail-installer.msi build/bin/Lightmail-portable.zip --draft --title "Lightmail $env:GITHUB_REF_NAME" --generate-notes
